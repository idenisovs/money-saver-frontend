<form (ngSubmit)="create()">
    <div class="modal-header">
        <h5 class="modal-title">New interval</h5>
        <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()"></button>
    </div>
    <div class="modal-body">
        <div class="row g-3 mb-3">
            <div class="col-12">
                Start and End dates
            </div>
            <div class="col-12 col-md-6">
                <div class="dp-hidden position-absolute">
                    <div class="input-group">
                        <input
                            name="datepicker"
                            class="form-control"
                            ngbDatepicker
                            #datepicker="ngbDatepicker"
                            [autoClose]="'outside'"
                            (dateSelect)="onDateSelection($event)"
                            [displayMonths]="2"
                            [dayTemplate]="t"
                            outsideDays="hidden"
                            [startDate]="fromDate()!"
                            tabindex="-1"
                        />
                        <ng-template #t let-date let-focused="focused">
                            <div
                                class="custom-day"
                                [class.focused]="focused"
                                [class.range]="isRange(date)"
                                [class.faded]="isHovered(date) || isInside(date)"
                                (mouseenter)="hoveredDate.set(date)"
                                (mouseleave)="hoveredDate.set(null)"
                            >
                                {{ date.day }}
                            </div>
                        </ng-template>
                    </div>
                </div>
                <div class="input-group">
                    <input
                        id="interval-from"
                        #dpFromDate
                        class="form-control"
                        placeholder="yyyy-mm-dd"
                        name="dpFromDate"
                        [value]="formatter.format(fromDate())"
                        (input)="fromDate.set(validateInput(fromDate(), dpFromDate.value))"
                    />
                    <button class="btn btn-outline-secondary" (click)="datepicker.toggle()" type="button">
                        🗓
                    </button>
                </div>
            </div>
            <div class="col-12 col-md-6">
                <div class="input-group">
                    <input
                        #dpToDate
                        class="form-control"
                        placeholder="yyyy-mm-dd"
                        name="dpToDate"
                        [value]="formatter.format(toDate())"
                        (input)="toDate.set(validateInput(toDate(), dpToDate.value))"
                    />
                    <button class="btn btn-outline-secondary" (click)="datepicker.toggle()" type="button">
                        🗓
                    </button>
                </div>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="interval-sum">Sum</label>
            <input id="interval-sum" type="number" step="0.01" class="form-control" [formField]="intervalForm.sum"/>
        </div>
    </div>
    <div class="modal-footer">
        <button type="submit" class="btn btn-primary" [disabled]="intervalForm().invalid() || isLoading()">
            Save
        </button>
        <button type="button" class="btn btn-outline-secondary" (click)="activeModal.dismiss()">
            Cancel
        </button>
    </div>
</form>
