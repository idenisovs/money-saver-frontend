<div class="container">
    <h1 class="mt-5">
        Money Saver
        <small class="text-body-secondary">
            A personal expenses manager.
        </small>
    </h1>
    <div class="card mt-5">
        <div class="card-header">
            Authentication
        </div>
        <div class="card-body">
            <form [formGroup]="loginForm" (ngSubmit)="login()">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="login-input" placeholder="name@example.com" formControlName="username" autofocus>
                    <label for="login-input">Username</label>
                </div>
                <div class="form-floating">
                    <input type="password" class="form-control" id="password-input" placeholder="Password" formControlName="password">
                    <label for="password-input">Password</label>
                </div>
                @if (error(); as error) {
                    <div class="alert alert-danger mt-3" role="alert">
                        {{ error }}
                    </div>
                }
                <div class="mt-3">
                    <button type="submit" class="btn btn-primary" [disabled]="loginForm.invalid || isLoading()">
                        Login
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
